# Stream Automation Configuration

# Paths
paths:
  output_dir: "./output"
  temp_dir: "./temp"

# Silence detection
silence:
  threshold_db: -40             # Audio level threshold for silence (in dB)
  min_duration: 0.5             # Minimum silence duration to cut (seconds)
  padding: 0.1                  # Padding to keep around speech (seconds)

# Transcription settings (Return Zero API)
transcription:
  provider: "returnzero"
  language_hints:
    - "ko"
    - "en"

# Claude API settings for content analysis
analysis:
  model: "claude-sonnet-4-20250514"

  longform:
    min_chapter_duration: 60    # Minimum chapter length (seconds)
    max_chapters: 20            # Maximum chapters to generate

  shortform:
    min_clips: 10               # Minimum clips to generate
    max_clip_duration: 180      # Max clip length (seconds) - YouTube Shorts limit
    max_clips: 30               # Maximum clips to extract

    # Content signals for viral detection (market/trading content)
    viral_signals:
      - "bold market predictions"
      - "contrarian takes"
      - "price calls"
      - "I told you so moments"
      - "surprising insights"
      - "emotional reactions"

# Video settings
video:
  shortform:
    resolution: "1080x1920"     # 9:16 vertical
    webcam_position: "top"      # top or bottom
    webcam_height_ratio: 0.4    # 40% of frame for webcam

# Adobe Premiere export settings
premiere:
  fps: 30                       # Timeline framerate
  sample_rate: 48000            # Audio sample rate
  timecode_start: "00:00:00:00"

# Caption settings
captions:
  formats:
    - "srt"
    - "vtt"
